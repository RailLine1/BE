spring:
  application:
    name: daybit-server
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway 가 관리해요. 엔티티와 어긋나면 기동 실패.
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 50MB         # P-MAT-02 파일 크기 상한 (정책서 [미정], 임시값)
      max-request-size: 51MB
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}              # Railway 는 포트를 PORT 환경 변수로 줘요
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: alpha

daybit:
  public-base-url: http://localhost:8080
  jwt:
    # 운영에서는 반드시 환경 변수 DAYBIT_JWT_SECRET 으로 바꿔요 (32바이트 이상).
    secret: ${DAYBIT_JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    access-ttl: 30m
    refresh-ttl: 14d
  cors:
    allowed-origins: ${DAYBIT_CORS_ORIGINS:http://localhost:8081,http://localhost:19006}
  storage:
    type: ${DAYBIT_STORAGE_TYPE:local}       # local(디스크) | s3(Cloudflare R2)
    local-dir: ${DAYBIT_STORAGE_DIR:./data/storage}
    s3:
      endpoint: ${DAYBIT_R2_ENDPOINT:}       # https://<계정 ID>.r2.cloudflarestorage.com
      bucket: ${DAYBIT_R2_BUCKET:}
      access-key: ${DAYBIT_R2_ACCESS_KEY:}
      secret-key: ${DAYBIT_R2_SECRET_KEY:}
  gemini:
    api-key: ${DAYBIT_GEMINI_API_KEY:}       # 비어 있으면 문제를 만들지 않아요
    models: ${DAYBIT_GEMINI_MODEL:gemini-3.8-flash,gemini-flash-latest,gemini-3.5-flash,gemini-flash-lite-latest}   # 쉼표로 여러 개. 앞에서부터 시도
  github:
    client-id: ${DAYBIT_GITHUB_CLIENT_ID:}
    client-secret: ${DAYBIT_GITHUB_CLIENT_SECRET:}
    # 로그인 뒤 일회용 code 를 받을 앱 주소 패턴 (쉼표 구분, * 사용 가능)
    allowed-redirects: ${DAYBIT_GITHUB_REDIRECTS:daybit://*,exp://*,http://localhost:*}
  workspace:
    template-repo: ${DAYBIT_WORKSPACE_TEMPLATE:RailLine1/AI}   # 관리자 저장소로 복사할 템플릿 (공개 + Template repository 여야 해요)
  firebase:
    credentials: ${DAYBIT_FIREBASE_CREDENTIALS:}   # 서비스 계정 JSON(원문 또는 base64). 비우면 푸시를 보내지 않아요

---
spring:
  config:
    activate:
      on-profile: local
    # 로컬에서는 BE/.env 의 키(Gemini 등)를 읽어요. 파일이 없어도 괜찮아요. 배포 서버는 Railway 변수를 써요.
    import: optional:file:.env[.properties]
  docker:
    compose:
      lifecycle-management: start-only   # 서버를 꺼도 DB 컨테이너는 유지

logging:
  level:
    app.daybit: debug

---
spring:
  config:
    activate:
      on-profile: prod
  # DATABASE_URL 은 JDBC 형식(jdbc:postgresql://...)이어야 해요.
  # 비워 두면 Railway Postgres 가 주는 PGHOST · PGPORT · PGDATABASE · PGUSER · PGPASSWORD 로 조립해요.
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}}
    username: ${DATABASE_USERNAME:${PGUSER}}
    password: ${DATABASE_PASSWORD:${PGPASSWORD}}

# 해커톤 동안은 프론트가 배포 서버의 /v3/api-docs 로 Orval 을 돌리도록 Swagger 를 켜 둬요.
# 정식 출시 때는 DAYBIT_SWAGGER_ENABLED=false 로 꺼요.
springdoc:
  api-docs:
    enabled: ${DAYBIT_SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${DAYBIT_SWAGGER_ENABLED:true}

daybit:
  public-base-url: ${DAYBIT_PUBLIC_BASE_URL}
  jwt:
    secret: ${DAYBIT_JWT_SECRET}   # 운영에서는 기본값 없이 꼭 넣어야 떠요
